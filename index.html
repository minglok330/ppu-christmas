<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>噗噗的圣诞树 🎄</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020203;color:#fff;font-family:"Segoe UI","Microsoft YaHei",sans-serif}body{background:radial-gradient(ellipse at 50% 46%,#14100b 0,#050505 45%,#000 80%)}canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px 4vh;pointer-events:none;text-align:center;gap:8px}#title{font-family:'Brush Script MT','Segoe Script','Lucida Calligraphy',cursive;font-size:clamp(42px,8vw,76px);font-weight:600;font-style:normal;letter-spacing:1px;color:#f7d8ff;text-shadow:0 3px 8px #000,0 0 14px #d6a6ff,0 0 30px #8e5bd4;opacity:0;transition:opacity 2s;margin:0 0 2px}#subtitle{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:clamp(21px,4vw,32px);font-weight:800;letter-spacing:3px;color:#ffd9e8;text-shadow:0 3px 7px #000,0 0 12px #000,0 0 18px #d46b9c;opacity:0;transition:opacity 2s;padding:8px 18px;border-radius:14px;background:rgba(10,4,14,.72);border:1px solid rgba(255,190,220,.5)}#treeBtn{pointer-events:auto;border:0;background:transparent;color:#fff;font-size:48px;filter:drop-shadow(0 0 16px #ffdf86);margin-top:16px;cursor:pointer;animation:beat 1.7s infinite;opacity:0;transition:opacity 1s}#hint{opacity:0;color:#d6c9b4;font-size:14px;letter-spacing:2px;margin-top:4px;transition:opacity 1s}#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity 1s}#message.show{opacity:1;pointer-events:auto}#card{border:1px solid rgba(255,221,150,.65);padding:34px 28px;border-radius:18px;background:radial-gradient(ellipse,#21180e,#080707);box-shadow:0 0 45px #c88a3140;text-align:center;max-width:90vw}#card h1{font-size:54px;margin:0;color:#f3d58a;filter:drop-shadow(0 0 12px #c88a31)}#card p{font-size:clamp(22px,5vw,34px);color:#fff;margin:18px 0 0;text-shadow:0 0 15px #c88a31}#close{margin-top:24px;background:transparent;border:1px solid #d9bd7a;color:#e8d7ad;padding:8px 20px;border-radius:20px;cursor:pointer}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
</style></head><body><canvas id="c"></canvas><div id="ui"><div id="title">Merry Christmas</div><div id="subtitle">圣诞节快乐</div><button id="treeBtn" aria-label="打开圣诞祝福">🎄</button><div id="hint">点击圣诞树</div></div><div id="message"><div id="card"><h1>🎄</h1><p>噗噗圣诞节快乐！🎄</p><button id="close">关闭</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR,particles=[],lights=[],ornaments=[],snow=[],angle=0,treeH,treeR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);build()}
function build(){particles=[];lights=[];ornaments=[];snow=[];treeH=Math.min(H*.49,W*.68);treeR=treeH*.34;
// Tree: y runs from top (0) to base (treeH); radius grows downwards, fixing the upside-down cone.
for(let i=0;i<4300;i++){let y=Math.random()*treeH,frac=y/treeH,rmax=treeR*frac;let a=Math.random()*Math.PI*2,r=rmax*Math.sqrt(Math.random());particles.push({x:Math.cos(a)*r,y:y-treeH/2,z:Math.sin(a)*r,sz:Math.random()*1.8+.45,hue:Math.random(),phase:Math.random()*6.28})}
// Colorful ornaments distributed across the cone, staying within the tree silhouette
for(let i=0;i<95;i++){let f=Math.random()*.92+.08,y=f*treeH-treeH/2,rad=treeR*f*.88,a=Math.random()*Math.PI*2,r=rad*Math.sqrt(Math.random());ornaments.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:Math.random()*4.2+3,color:['#d71938','#f6d36b','#4fc9ff','#f6f1df','#c45aff'][Math.floor(Math.random()*5)],phase:Math.random()*6.28})}
// Tiny decorative stars and candy-like accents
for(let i=0;i<28;i++){let f=Math.random()*.86+.12,y=f*treeH-treeH/2,rad=treeR*f*.82,a=Math.random()*Math.PI*2,r=rad*Math.sqrt(Math.random());ornaments.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:Math.random()*2.4+2,type:'star',color:'#ffe9a6',phase:Math.random()*6.28})}
// Long elegant spiral light garland, wound from the tip down toward the wide base
for(let i=0;i<1400;i++){let f=i/1399,y=f*treeH,r=treeR*f,a=f*19*Math.PI+Math.random()*.035;lights.push({x:Math.cos(a)*r,y:y-treeH/2,z:Math.sin(a)*r,phase:Math.random()*6.28,size:Math.random()*2.2+1,color:['#ffe08a','#ffd15a','#fff2bc','#f8b85e','#e9f4c0'][Math.floor(Math.random()*5)]})}
for(let i=0;i<220;i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.1+.4,s:Math.random()*1.25+.35,drift:Math.random()*1.2-.6})}
function project(p){let cx=W/2,cy=H*.385,rot=angle,x=p.x*Math.cos(rot)-p.z*Math.sin(rot),z=p.x*Math.sin(rot)+p.z*Math.cos(rot),pers=1/(1+z/600);return[cx+x*pers,cy+p.y*pers,pers]}
function glow(x,y,r,color){ctx.save();ctx.shadowBlur=r*4;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawStarSmall(x,y,r,color){ctx.save();ctx.translate(x,y);ctx.shadowBlur=13;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function drawStar(x,y){let pulse=1+Math.sin(Date.now()*.003)*.13,r=25*pulse;ctx.save();ctx.translate(x,y);ctx.shadowBlur=42;ctx.shadowColor='#ffd86a';ctx.fillStyle='#fff5bd';ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore();glow(x,y,4,'#fff')}
function frame(){ctx.clearRect(0,0,W,H);for(let i=0;i<95;i++){let x=(i*137.5)%W,y=(i*83.7)%H;ctx.fillStyle='rgba(255,220,150,.22)';ctx.fillRect(x,y,1,1)}
let cx=W/2,cy=H*.385,pts=particles.map(p=>({q:project(p),p})).sort((a,b)=>a.q[2]-b.q[2]);
// subtle trunk at bottom
ctx.fillStyle='#57341d';ctx.fillRect(cx-11,cy+treeH*.45,22,treeH*.13);
for(let {q,p} of pts){let x=q[0],y=q[1],s=p.sz*q[2],c=p.hue<.56?'rgba(10,105,49,.82)':p.hue<.78?'rgba(24,160,75,.75)':p.hue<.93?'rgba(52,195,103,.65)':'rgba(255,204,92,.8)';ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,s,0,6.28);ctx.fill();if(p.hue>.96&&Math.sin(Date.now()*.005+p.phase)>.62)glow(x,y,s+1,'#ffd96a')}
for(let l of lights){let q=project(l),blink=.5+.5*Math.sin(Date.now()*.005+l.phase);glow(q[0],q[1],l.size*blink,q[2]>.9?l.color:l.color);if(blink>.9)glow(q[0],q[1],l.size*2.6,'#ffe5a1')}
// Render hanging baubles and little ornaments
for(let o of ornaments){let q=project(o),pulse=.85+.15*Math.sin(Date.now()*.004+o.phase);if(o.type==='star'){drawStarSmall(q[0],q[1],o.size*pulse,o.color)}else{ctx.save();ctx.shadowBlur=12;ctx.shadowColor=o.color;ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(q[0],q[1],o.size*pulse*q[2],0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(q[0]-o.size*.25*q[2],q[1]-o.size*.28*q[2],Math.max(1,o.size*.22*q[2]),0,Math.PI*2);ctx.fill();ctx.restore()}}
// Tip is correctly at the top; tree widens toward the bottom
let topY=cy-treeH/2-9;drawStar(cx,topY);
for(let s of snow){s.y+=s.s;s.x+=s.drift+Math.sin(s.y*.01)*.25;if(s.y>H+4){s.y=-4;s.x=Math.random()*W}ctx.fillStyle='rgba(255,255,255,.88)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()}
angle+=.0032;requestAnimationFrame(frame)}
resize();addEventListener('resize',resize);frame();setTimeout(()=>{for(let id of ['title','subtitle','treeBtn','hint'])document.getElementById(id).style.opacity=1},1200);
document.getElementById('treeBtn').onclick=()=>document.getElementById('message').classList.add('show');document.getElementById('close').onclick=()=>document.getElementById('message').classList.remove('show');document.getElementById('message').onclick=e=>{if(e.target.id==='message')e.currentTarget.classList.remove('show')};
</script></body></html>
